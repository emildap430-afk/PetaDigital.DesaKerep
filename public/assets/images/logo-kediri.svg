<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Outer Pentagon Shield Border -->
  <polygon points="50,4 96,20 86,92 50,116 14,92 4,20" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  
  <!-- Inner Shield Base -->
  <polygon points="50,8 90,22 81,88 50,110 19,88 10,22" fill="#0f172a"/>
  
  <!-- Left Side Red Field, Right Side Green Field -->
  <path d="M50,8 L10,22 L19,88 L50,110 Z" fill="#dc2626"/>
  <path d="M50,8 L90,22 L81,88 L50,110 Z" fill="#15803d"/>
  
  <!-- Yellow/Gold Center Vertical Line -->
  <line x1="50" y1="8" x2="50" y2="110" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- Top Gold Star -->
  <polygon points="50,14 53,22 61,22 54,27 57,35 50,30 43,35 46,27 39,22 47,22" fill="#fbbf24" stroke="#d97706" stroke-width="0.5"/>

  <!-- Padi (Left - Yellow) -->
  <path d="M25,38 C20,56 28,74 42,86" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="2.5,1.5" stroke-linecap="round"/>
  <!-- Kapas (Right - White) -->
  <path d="M75,38 C80,56 72,74 58,86" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="2.5,1.5" stroke-linecap="round"/>

  <!-- Center Symbol: Keris Canda Bhirawa & Mountain -->
  <polygon points="32,82 50,56 68,82" fill="#064e3b" opacity="0.9" stroke="#fef08a" stroke-width="1"/>
  <!-- Keris Blade -->
  <path d="M50,34 L50,78" stroke="#fef08a" stroke-width="2"/>
  <path d="M50,36 Q54,42 50,48 Q46,54 50,60 Q54,66 50,72 Q46,76 50,78" fill="none" stroke="#fbbf24" stroke-width="2.5"/>

  <!-- Bottom Ribbon with CANDA BHIRAWA Text -->
  <path d="M12,90 Q50,106 88,90 L85,99 Q50,115 15,99 Z" fill="#fbbf24" stroke="#92400e" stroke-width="1"/>
  <text x="50" y="98" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="6.5" fill="#1e1b4b" text-anchor="middle" letter-spacing="0.3">CANDA BHIRAWA</text>
</svg>
