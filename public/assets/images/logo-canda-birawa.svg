    <path d="M -14 -2 Q -25 -10 -20 -20" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 14 -2 Q 25 -10 20 -20" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M -14 5 Q -24 15 -18 20" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round" />
